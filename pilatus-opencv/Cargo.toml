[package]
name = "pilatus-opencv"
version = "0.1.0"
edition = "2021"

[dependencies]
futures = "0.3"
imbuf-opencv = { workspace = true }
opencv = { workspace = true }
pilatus = { git = "https://github.com/mineichen/pilatus.git", branch = "main" }
rayon = "1.10.0"
serde = { workspace = true }
thiserror = "2"
tracing = { workspace = true }
typed_floats = { version = "1.0.3", features = ["serde"] }

[dev-dependencies]
opencv = { workspace = true, features = ["clang-runtime", "imgcodecs"] }

[features]
clang-runtime = ["opencv/clang-runtime"]
calib3d = ["opencv/calib3d", "opencv/objdetect", "opencv/imgproc"]
